<!doctype html>
<html lang=""en"">
<head>
  <meta charset=""UTF-8"">
  <meta name=""viewport"" content=""width=device-width, initial-scale=1.0"">
  <title>Admin Panel - Ambalangoda Tourist Day Planner</title>
  <script src=""https://cdn.tailwindcss.com""></script>
  <script src=""js/tailwind-config.js""></script>
  <link rel=""stylesheet"" href=""css/style.css"">
</head>
<body class=""bg-sand-50 text-ink min-h-screen flex flex-col"">
  
  <header class=""sticky top-0 z-20 border-b border-sand-200 bg-sand-50/95 backdrop-blur"">
    <nav class=""mx-auto flex h-16 max-w-6xl items-center justify-between gap-6 px-6"">
      <a href=""index.html"" class=""font-display text-lg font-semibold tracking-tight text-ink"">
        Explore<span class=""text-ocean-600"">Ambalangoda</span> <span class=""text-coral-600 text-sm"">ADMIN</span>
      </a>
      <div class=""hidden items-center gap-1 md:flex"">
        <a href=""index.html"" class=""rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out text-ink-500 hover:text-ink"">Home</a>
        <a href=""attractions.html"" class=""rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out text-ink-500 hover:text-ink"">Places</a>
      </div>
    </nav>
  </header>

  <main class=""flex-1 py-12 px-6"">
    <div class=""mx-auto max-w-6xl"">
      <div class=""mb-12 flex justify-between items-center"">
        <div>
          <h1 class=""font-display text-3xl font-bold tracking-tight sm:text-4xl"">Admin Panel</h1>
          <p class=""mt-4 text-lg text-ink-500"">Manage tourist attractions and locations.</p>
        </div>
      </div>

      <div class=""bg-white rounded-2xl shadow-sm border border-sand-200 overflow-hidden"">
        <table class=""w-full text-left text-sm"">
          <thead class=""bg-sand-100/50 text-ink-600 font-semibold border-b border-sand-200"">
            <tr>
              <th class=""px-6 py-4"">Place Name</th>
              <th class=""px-6 py-4"">Category</th>
              <th class=""px-6 py-4"">Distance (km)</th>
              <th class=""px-6 py-4 text-right"">Actions</th>
            </tr>
          </thead>
          <tbody id=""admin-places-list"" class=""divide-y divide-sand-100"">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    async function loadAdminPlaces() {
      const res = await fetch('api/get_places.php');
      const places = await res.json();
      const tbody = document.getElementById('admin-places-list');
      
      let html = '';
      places.forEach(place => {
        html += 
          <tr class=""hover:bg-sand-50/50 transition-colors"">
            <td class=""px-6 py-4 font-medium text-ink""> + place.name + </td>
            <td class=""px-6 py-4 text-ink-600""> + place.category_label + </td>
            <td class=""px-6 py-4 text-ink-600""> + place.distanceKm + </td>
            <td class=""px-6 py-4 text-right"">
              <button onclick=""deletePlace(' + place.id + ')"" class=""text-coral-600 hover:text-coral-700 font-medium text-sm"">Delete</button>
            </td>
          </tr>
        ;
      });
      tbody.innerHTML = html;
    }

    async function deletePlace(id) {
      if(!confirm('Are you sure you want to delete this place?')) return;
      
      try {
        const res = await fetch('api/delete_place.php', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ id })
        });
        const data = await res.json();
        if(data.success) {
          loadAdminPlaces();
        } else {
          alert('Failed to delete');
        }
      } catch (err) {
        console.error(err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadAdminPlaces);
  </script>
</body>
</html>
