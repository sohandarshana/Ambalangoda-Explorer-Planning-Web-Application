<!doctype html>
<html lang=""en"">
<head>
  <meta charset=""UTF-8"">
  <meta name=""viewport"" content=""width=device-width, initial-scale=1.0"">
  <title>Admin Panel - Explore Ambalangoda</title>
  <script src=""https://cdn.tailwindcss.com""></script>
  <script src=""js/tailwind-config.js""></script>
  <link rel=""stylesheet"" href=""css/style.css"">
</head>
<body class=""bg-sand-50 text-ink min-h-screen flex flex-col"">
  <header class=""sticky top-0 z-20 border-b border-sand-200 bg-sand-50/95 backdrop-blur"">
    <nav class=""mx-auto flex h-16 max-w-6xl items-center justify-between gap-6 px-6"">
      <a href=""index.html"" class=""font-display text-lg font-semibold tracking-tight text-ink"">
        Explore<span class=""text-ocean-600"">Ambalangoda</span> <span class=""text-coral-600 ml-2 font-bold text-sm"">ADMIN</span>
      </a>
      <div class=""hidden items-center gap-1 md:flex"">
        <a href=""index.html"" class=""rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out text-ink-500 hover:text-ink"">Home</a>
        <a href=""attractions.html"" class=""rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out text-ink-500 hover:text-ink"">Places</a>
        <a href=""admin.html"" class=""rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out bg-coral-100 text-coral-700"">Admin Dashboard</a>
      </div>
    </nav>
  </header>

  <main class=""flex-1 py-12 px-6"">
    <div class=""mx-auto max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-8"">
      
      <!-- Add New Place Form -->
      <div class=""lg:col-span-1"">
        <div class=""bg-white rounded-2xl shadow-sm border border-sand-200 p-6"">
          <h2 class=""font-display text-xl font-bold mb-6"">Add New Place</h2>
          <form id=""addPlaceForm"" class=""space-y-4"">
            <div>
              <label class=""block text-sm font-medium text-ink-600 mb-1"">Place Name</label>
              <input type=""text"" id=""p_name"" required class=""w-full rounded-md border border-sand-300 px-3 py-2"">
            </div>
            <div>
              <label class=""block text-sm font-medium text-ink-600 mb-1"">Category</label>
              <select id=""p_cat"" required class=""w-full rounded-md border border-sand-300 px-3 py-2"">
                <option value=""Cultural Attraction"">Cultural Attraction</option>
                <option value=""Religious Site"">Religious Site</option>
                <option value=""Beach"">Beach</option>
                <option value=""Heritage & Nature"">Heritage & Nature</option>
                <option value=""Wildlife Attraction"">Wildlife</option>
                <option value=""Cafe"">Cafe</option>
                <option value=""Restaurant"">Restaurant</option>
              </select>
            </div>
            <div>
              <label class=""block text-sm font-medium text-ink-600 mb-1"">Distance (km)</label>
              <input type=""number"" step=""0.1"" id=""p_dist"" required class=""w-full rounded-md border border-sand-300 px-3 py-2"">
            </div>
            <div>
              <label class=""block text-sm font-medium text-ink-600 mb-1"">Summary</label>
              <textarea id=""p_summary"" required class=""w-full rounded-md border border-sand-300 px-3 py-2""></textarea>
            </div>
            <button type=""submit"" class=""w-full bg-ocean-600 text-white font-bold py-2 rounded-md hover:bg-ocean-700"">Save Place</button>
          </form>
        </div>
      </div>

      <!-- Places List -->
      <div class=""lg:col-span-2"">
        <div class=""bg-white rounded-2xl shadow-sm border border-sand-200 overflow-hidden"">
          <div class=""p-6 border-b border-sand-200"">
            <h2 class=""font-display text-xl font-bold"">Manage Existing Places</h2>
          </div>
          <table class=""w-full text-left text-sm"">
            <thead class=""bg-sand-50 text-ink-600 font-semibold"">
              <tr>
                <th class=""px-6 py-4"">Name</th>
                <th class=""px-6 py-4"">Category</th>
                <th class=""px-6 py-4"">Distance</th>
                <th class=""px-6 py-4 text-right"">Actions</th>
              </tr>
            </thead>
            <tbody id=""admin-places-list"" class=""divide-y divide-sand-100""></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script>
    async function loadAdminPlaces() {
      const res = await fetch('api/get_places.php');
      const places = await res.json();
      const tbody = document.getElementById('admin-places-list');
      let html = '';
      places.forEach(place => {
        html += 
          <tr class=""hover:bg-sand-50/50"">
            <td class=""px-6 py-4 font-medium""> + place.name + </td>
            <td class=""px-6 py-4""> + place.category_label + </td>
            <td class=""px-6 py-4""> + place.distanceKm +  km</td>
            <td class=""px-6 py-4 text-right"">
              <button onclick=""deletePlace(' + place.id + ')"" class=""text-coral-600 hover:text-coral-800 font-medium"">Delete</button>
            </td>
          </tr>
        ;
      });
      tbody.innerHTML = html;
    }

    async function deletePlace(id) {
      if(!confirm('Are you sure you want to delete this place?')) return;
      await fetch('api/delete_place.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id })
      });
      loadAdminPlaces();
    }

    document.getElementById('addPlaceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('p_name').value;
      const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const payload = {
        id: id,
        name: name,
        category_id: document.getElementById('p_cat').value,
        distanceKm: parseFloat(document.getElementById('p_dist').value),
        summary: document.getElementById('p_summary').value,
        imageUrl: 'e82c79b4-8b3c-4029-83c5-254bfbd49898.jpg' // Default placeholder image
      };
      
      const res = await fetch('api/add_place.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      if(res.ok) {
        document.getElementById('addPlaceForm').reset();
        loadAdminPlaces();
      }
    });

    document.addEventListener('DOMContentLoaded', loadAdminPlaces);
  </script>
</body>
</html>
