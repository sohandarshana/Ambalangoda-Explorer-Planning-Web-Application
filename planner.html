        <a href="index.html" class="rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out text-ink-500 hover:text-ink">Home</a>

          My day <span id="cart-count" class="rounded-full bg-sand-50/20 px-1.5 text-xs tabular-nums">0</span>

            <button id="darkToggle" onclick="toggleDark()" title="Toggle dark mode" class="ml-2 rounded-full w-8 h-8 flex items-center justify-center border border-sand-200 text-ink-500 hover:text-ink hover:bg-sand-100 transition-colors" aria-label="Toggle dark mode">

        <svg id="iconMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>

  <main class="flex-1 py-12 px-6">

      </div>

      <div class="grid gap-8 lg:grid-cols-[1fr_400px]">

          <div class="text-ink-500">Loading your itinerary...</div>

        <div class="sticky top-24 h-[600px] rounded-2xl border border-sand-200 bg-sand-100 overflow-hidden flex items-center justify-center">

    </div>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderPlanner();
    });
  </script>
<script>
  function applyDark(on) {
    document.documentElement.classList.toggle('dark', on);
    var sun = document.getElementById('iconSun');
    var moon = document.getElementById('iconMoon');
    if (sun) sun.classList.toggle('hidden', !on);
    if (moon) moon.classList.toggle('hidden', on);
  }
  function toggleDark() {
    var isDark = !document.documentElement.classList.contains('dark');
    localStorage.setItem('darkMode', isDark ? '1' : '0');
    applyDark(isDark);
  }
  (function() { applyDark(localStorage.getItem('darkMode') === '1'); })();
</script></body>
</html>
