<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambalangoda Tourist Day Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-sand-50 text-ink min-h-screen flex flex-col">
  
  <header class="absolute inset-x-0 top-0 z-20">
    <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-6 px-6">
      <a href="index.html" class="font-display text-lg font-semibold tracking-tight text-sand-50">
        Explore<span class="text-ochre-500">Ambalangoda</span>
      </a>
      <div class="hidden items-center gap-1 md:flex">
        <a href="index.html" class="rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out bg-sand-50/15 text-sand-50">Home</a>
        <a href="attractions.html" class="rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out text-sand-100/80 hover:text-sand-50">Places</a>
        <a href="planner.html" class="rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out text-sand-100/80 hover:text-sand-50">Day planner</a>
        <a href="planner.html" class="ml-2 inline-flex items-center gap-2 rounded-full bg-ochre-600 px-4 py-2 text-sm font-semibold text-sand-50 transition-colors duration-150 ease-out hover:bg-ochre-500">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>
          My day <span id="cart-count" class="rounded-full bg-sand-50/20 px-1.5 text-xs tabular-nums">0</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="flex-1">
    <div class="hero-section">
      <div class="container-full w-full h-[600px] relative">
        <img src="09d90b8d-7781-4c23-8a84-8c9eebd92398.jpg" class="backgroundImage" alt="Ambalangoda Coast">
        <div class="animated hue"></div>
        <div class="absolute inset-0 z-10 flex flex-col items-center justify-center text-center px-6">
          <h1 class="font-display text-4xl font-bold tracking-tight text-sand-50 sm:text-6xl md:text-7xl">
            A quiet town with <br/><span class="text-ochre-500">loud traditions.</span>
          </h1>
          <p class="mt-6 max-w-2xl text-lg text-sand-100 sm:text-xl">
            Ambalangoda is Sri Lanka's centre for ritual masks, string puppetry, and coastal heritage. Plan your perfect day trip here.
          </p>
          <div class="mt-10 flex items-center gap-4">
            <a href="attractions.html" class="rounded-full bg-sand-50 px-6 py-3 text-sm font-semibold text-ocean-900 transition-colors hover:bg-sand-200">
              Explore places
            </a>
            <a href="planner.html" class="rounded-full border border-sand-50/30 bg-ocean-900/40 px-6 py-3 text-sm font-semibold text-sand-50 backdrop-blur transition-colors hover:bg-ocean-900/60">
              Start planning
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-sand-200 bg-sand-100 py-12 mt-12">
    <div class="mx-auto max-w-6xl px-6 text-center text-sm text-ink-500">
      <p>&copy; 2026 Ambalangoda Tourism. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
