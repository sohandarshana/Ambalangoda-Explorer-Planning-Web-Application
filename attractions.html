<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places - Ambalangoda Tourist Day Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-sand-50 text-ink min-h-screen flex flex-col">
  
  <header class="sticky top-0 z-20 border-b border-sand-200 bg-sand-50/95 backdrop-blur">
    <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-6 px-6">
      <a href="index.html" class="font-display text-lg font-semibold tracking-tight text-ink">
        Explore<span class="text-ocean-600">Ambalangoda</span>
      </a>
      <div class="hidden items-center gap-1 md:flex">
        <a href="index.html" class="rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out text-ink-500 hover:text-ink">Home</a>
        <a href="attractions.html" class="rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out bg-ocean-100 text-ocean-700">Places</a>
        <a href="planner.html" class="rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out text-ink-500 hover:text-ink">Day planner</a>
        <a href="planner.html" class="ml-2 inline-flex items-center gap-2 rounded-full bg-ochre-600 px-4 py-2 text-sm font-semibold text-sand-50 transition-colors duration-150 ease-out hover:bg-ochre-500">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>
          My day <span id="cart-count" class="rounded-full bg-sand-50/20 px-1.5 text-xs tabular-nums">0</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="flex-1 py-12 px-6">
    <div class="mx-auto max-w-6xl">
      <div class="mb-12 max-w-2xl">
        <h1 class="font-display text-3xl font-bold tracking-tight sm:text-4xl">Places to visit</h1>
        <p class="mt-4 text-lg text-ink-500">Everything from mask carving workshops to hidden coves.</p>
      </div>

      <!-- Categories Filter -->
      <div class="mb-8 flex flex-wrap gap-2" id="categories-container">
        <!-- Fetched dynamically -->
      </div>

      <!-- Places List -->
      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3" id="places-container">
        <div class="text-ink-500">Loading places...</div>
      </div>
    </div>
  </main>

  <footer class="border-t border-sand-200 bg-sand-100 py-12">
    <div class="mx-auto max-w-6xl px-6 text-center text-sm text-ink-500">
      <p>&copy; 2026 Ambalangoda Tourism. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetchPlacesAndCategories();
    });
  </script>
</body>
</html>
