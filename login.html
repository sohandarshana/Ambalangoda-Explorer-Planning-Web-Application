<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ambalangoda Tourist Day Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark.css">
</head>
<body class="bg-sand-50 text-ink min-h-screen flex flex-col">
  <header class="sticky top-0 z-20 border-b border-sand-200 bg-sand-50/95 backdrop-blur">
    <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-6 px-6">
      <a href="index.html" class="font-display text-lg font-semibold tracking-tight text-ink">
        Explore<span class="text-ocean-600">Ambalangoda</span>
      </a>
      <div class="hidden items-center gap-1 md:flex" id="nav-links">
        <a href="index.html" class="rounded-full px-3.5 py-2 text-sm font-medium transition-colors duration-150 ease-out text-ink-500 hover:text-ink">Home</a>
      </div>
    </nav>
  </header>

  <main class="flex-1 flex items-center justify-center py-12 px-6">
    <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-sm ring-1 ring-sand-200">
      <h1 class="font-display text-2xl font-bold tracking-tight text-ink text-center mb-6">Welcome Back</h1>
      <div id="error-msg" class="hidden mb-4 rounded-md bg-red-50 p-3 text-sm text-red-600"></div>
      
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-ink-700">Email Address</label>
          <input type="email" id="email" required class="mt-1 w-full rounded-md border border-sand-300 px-4 py-2 text-ink focus:border-ocean-500 focus:outline-none focus:ring-1 focus:ring-ocean-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-ink-700">Password</label>
          <input type="password" id="password" required class="mt-1 w-full rounded-md border border-sand-300 px-4 py-2 text-ink focus:border-ocean-500 focus:outline-none focus:ring-1 focus:ring-ocean-500">
        </div>
        <button type="submit" class="w-full rounded-md bg-ocean-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-ocean-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ocean-600">
          Sign In
        </button>
      </form>
      
      <p class="mt-6 text-center text-sm text-ink-500">
        Don't have an account? <a href="register.html" class="font-medium text-ocean-600 hover:text-ocean-500">Register here</a>
      </p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      
      const formData = new FormData();
      formData.append('email', email);
      formData.append('password', password);
      
      try {
        const res = await fetch('api/auth_login.php', { method: 'POST', body: formData });
        const data = await res.json();
        
        if (data.success) {
          if (data.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        } else {
          errorMsg.textContent = data.error || 'Login failed';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = 'Network error. Please try again.';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
